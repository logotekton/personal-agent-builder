%YAML 1.2
---
# =============================================================================
# _ALL_TEMPLATES.yaml — 14개 빈 템플릿 묶음 (copy-start bundle)
# -----------------------------------------------------------------------------
# > EN: One file holding all 14 blank record skeletons — one YAML document per
# > user.* ontology pack (spec/03-pack-catalog.md). Every document carries the
# > full unified base required set (id, record_type, label, statement,
# > evidence_refs, confidence, scope, review_status, sensitivity, created_at,
# > updated_at) at empty/placeholder values, with the pack's record_type enum
# > in a comment. Copy a document out, rename `template` to your handle, fill it
# > against real evidence (G1), scope it (G2), use behavioral language (G4).
# -----------------------------------------------------------------------------
# 이 한 파일에 14개 `user.*` 팩의 빈 레코드 골격이 YAML 문서 하나씩 들어 있습니다.
# 각 문서는 통합 베이스 레코드(../spec/01-kernel-schema.md §7,
# ../schemas/record.base.schema.json)의 **필수 필드 전부**를 빈/플레이스홀더 값으로
# 담고, 해당 팩의 `record_type` enum 후보를 주석으로 적어 둡니다.
#
# 쓰는 법: 시작하려는 팩의 문서(`--- # user.<name>` 구획)를 통째로 복사 →
#   1) `id`의 `template`을 당신 핸들로 바꾸고 (예: jane.role.001),
#   2) `record_type`을 주석의 enum 중 하나로 고르고,
#   3) 베이스 필드부터 실제 증거에 묶어 채웁니다.
# 비교용 인덱스/주석/예제는 ./README.md · ./QUICKSTART.md 참고.
#
# 게이트(인용: ../spec/01-kernel-schema.md §2):
#   G1 증거 없는 주장 금지 (evidence_refs ≥ 1)
#   G2 스코프 없는 규칙 금지 (scope 비우지 말 것 — "항상 참" 금지)
#   G3 pending은 런타임 비활성 (confirmed/narrowed만 컴파일)
#   G4 행동 언어로만 기술 (추측 심리 금지)
#   G5 sensitive/restricted는 경계 규칙 먼저
#   G6 템플릿은 라이브 레코드를 담지 않음 — 이 파일의 모든 값은 비어 있어야 함
#
# 폐기 코드명(구 코드명) pa.t03 / t06 / x12 / .ba 등은 쓰지 않습니다.
# 정식 14개 팩 이름만 사용합니다 → ../spec/01-kernel-schema.md §5.
# =============================================================================


--- # user.identity_roles
