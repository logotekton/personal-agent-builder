# ── C2 · 교정 산물(eval.005 partial → next-action 필수) → NOVEL → INSERT ────────
# eval.005 가 보고에서 next action 을 빠뜨려 PARTIAL(0.7) 했음. 그 correction_notes 가
# 처방한 user.artifact_policy ReviewArtifactRecord 를 인입(빈 팩이라 novel insert). 이 규칙이
# 생기면 eval.005 가 재실행에서 PASS 로 전환됨(../evaluation-cases.yaml). → 팩 #4 시드.
- id: logotekton.artifact.001
  record_type: ReviewArtifactRecord
  label: "report must include next action"
  statement: "A task or pack report must always include an explicit next action; status, result, and defect alone are an incomplete report."
  evidence_refs: ["ev.eval.005#next_action_missing", "session_2026-06-28c#report_next_action"]
  confidence: 0.9
  scope: project_reporting
  review_status: confirmed
  sensitivity: internal
  created_at: "2026-06-28T00:00:00Z"
  updated_at: "2026-06-28T18:00:00Z"
  artifact_kind: report
  preferred_format: "compact status block: status / result / defect / next action"
  structure_rules:
    - "always end with an explicit next action (never omit it)"
    - "lead with the result (answer_first), keep it terse"
    - "four slots: status, result, defect, next action"
  applies_to_tasks: ["pack report", "task status report"]
  default_for_kind: true

# ── C3 · 세션 3 도구 선호(measured, not asserted) → NOVEL → INSERT ──────────────
# 세션 3에서 관찰된 도구 선택: 수렴/검증 숫자를 단언하지 말고 결정론적 도구를 실제로 돌려
# 산출하라(이 프로젝트의 evidence-first 에토스의 도구판). user.tool_stack 빈 팩 → novel insert.
# → 팩 #10 시드. (G4: 추측 취향이 아니라 관찰된 선택을 기술.)
