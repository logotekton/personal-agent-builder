# Logotekton — 세션 3 인입 후보 (incoming candidates for a SECOND flywheel revolution)
#
# > **EN:** The confirmed candidates mined from a *third* builder session, fed to the
# > dedup-judge actuator (tools/pab_merge.py) for a second turn of the data-engine wheel
# > (spec/02 loop). This batch is designed to exercise the verdicts revolution-01 did NOT —
# > and, above all, to prove the actuator's SAFETY and RESTRAINT, not just its happy paths:
# >
# >   C1 heuristic.301  → DUPLICATE → MERGE   (same heuristic re-derived a 3rd time; rep 2→3)
# >   C2 artifact.001   → NOVEL     → INSERT   (eval.005 partial fix: next-action required; seeds pack #4)
# >   C3 tool.001       → NOVEL     → INSERT   (a session-3 tool preference; seeds pack #10)
# >   C4 style.301      → CONFLICT  → SURFACE  (similar-but-not-equal to style.001 → NOT auto-applied)
# >
# > C4 is the point of this revolution: a *confirmed* candidate is still BLOCKED by the actuator
# > because it conflicts with existing confirmed knowledge (style.001). The judge surfaces it for
# > human reconciliation and never silently overwrites — proving G3/G5 hold at the merge layer, not
# > only at the confirmation gate. C4 is therefore left UNRESOLVED and does NOT enter instance-records.
# > These live in a subdir so convergence_report.py / dedup_check.py (top-level only) ignore them as
# > inputs, while validate_packs.py (recursive) still checks every one is a valid base record.
# >
# > Reproduce the PRE-merge plan (against the frozen T1 snapshot, since the live file is post-merge):
# >   python tools/pab_merge.py examples/logotekton/revolution-02/instance-records.pre.yaml \
# >                             examples/logotekton/revolution-02/session-03-candidates.yaml
#
# 이 파일은 세 번째 세션에서 채굴·확인된 인입 후보들입니다. dedup judge(tools/pab_merge.py)가
# 기존 인스턴스 레코드와 대조해 novel/duplicate/refinement/conflict 로 분류합니다. 이번 배치의
# 핵심은 C4 — *확인된* 후보라도 기존 확인 지식과 충돌하면 actuator 가 자동 적용을 거부하고
# 사람 검토로 surface 한다는 안전 속성(절대 조용히 덮어쓰지 않음, spec/10 §3)을 증명하는 것입니다.

