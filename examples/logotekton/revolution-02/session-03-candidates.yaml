# ── C4 · 보고 형식 재진술(유사하나 불일치) → CONFLICT → SURFACE (적용 안 함) ────
# 세션 3에서 사용자가 컴팩트 보고 규칙(style.001)을 살짝 다르게 재진술함: "result 를 먼저,
# defect 는 생략." 같은 record_type(StructureRecord)·같은 scope(project_reporting)이고 토큰
# 중첩(Jaccard ≈ 0.6 ∈ [0.5,0.85)) 이라 actuator 는 이를 refinement 인지 모순인지 단정할 수
# 없어 CONFLICT 로 분류하고 surface 한다 — 자동 적용 절대 금지(spec/10 §3). 이 후보는
# 사람 검토 대기 상태로 남으며 instance-records 에 적재되지 않는다(= 지표에 영향 없음).
- id: logotekton.style.301
