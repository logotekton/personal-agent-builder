# ── 팩 #11 · user.boundary_authority ─────────────────────────────────────────
# 무엇을 스스로 해도 되고 무엇을 사람에게 되돌려야 하는가. 후보: BoundaryRuleCandidate.
# 스키마: user.boundary_authority.schema.json
# ↓ revolution-01: eval.004 가 외부 메일을 확인 없이 발송해 FAIL → 그 correction_notes 가
#   처방한 ConfirmationRuleRecord 를 dedup judge(pab_merge)가 NOVEL→INSERT 로 적재. 이 규칙이
#   생기자 eval.004 가 재실행에서 PASS 로 전환됨(아래 evaluation-cases.yaml). 변경 이력은
#   drift-history.yaml 의 DriftRecord 로 남음. 이것이 데이터-엔진 한 바퀴의 actuator 작동.
user.boundary_authority:
  - id: logotekton.boundary.001
    record_type: ConfirmationRuleRecord
    label: "external email needs ask_confirm"
    statement: "Before sending anything to an external recipient, the runtime must stop and ask for explicit confirmation; never send without it."
    evidence_refs: ["ev.eval.004#boundary_fail", "session_2026-06-28b#boundary_fix"]
    confidence: 0.95
    scope: external_email
    review_status: confirmed
    sensitivity: internal
    created_at: "2026-06-28T00:00:00Z"
    updated_at: "2026-06-28T12:30:00Z"
    canonical_key: "d2aa520413a2"
    repetition_count: 1
    boundary_type: action
    requires_confirmation: true
    confirmation_trigger: ["external comms", "irreversible action"]
    applies_to_actions: ["sending messages"]
    blocked_actions: ["send external email without confirmation"]
    authority_level: ask_confirm
    enforcement: hard
    on_violation: ask_confirm
