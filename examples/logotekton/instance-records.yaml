# Logotekton — 확인된 인스턴스 레코드 (instance records)
#
# > **EN:** Real, confirmed instance records for the `logotekton` subject, mined from an
# > actual Personal Agent builder session and approved at the confirmation gate. Every
# > record validates against the unified base record (../../schemas/record.base.schema.json)
# > and its pack-specific schema (../../schemas/user.<pack>.schema.json). Records are grouped
# > as a YAML mapping keyed by the canonical pack name. These are the DATA layer of the
# > instance pack `personal.logotekton.*`, not templates — template/instance separation (G6).
#
# 이 파일은 실제 세션에서 채굴되어 확인 게이트(skill 07)를 통과한 logotekton 주체의
# 인스턴스 레코드입니다. 모든 레코드는 통합 베이스 레코드와 해당 팩 스키마를 동시에 만족합니다.
#   - 베이스 스키마        : ../../schemas/record.base.schema.json   (필수 11필드)
#   - 커널 스키마(어휘)    : ../../spec/01-kernel-schema.md          (§5 팩, §6 라우팅, §7 레코드)
#   - 팩 카탈로그          : ../../spec/03-pack-catalog.md           (팩별 정의)
# 매핑 키는 정식 14팩 이름(구 코드명 폐기)을 씁니다. id 형식: <subject>.<recordkind>.NNN.
# evidence_refs 는 이 세션(current_session)을 가리키며, 모든 항목은 검토 후 confirmed 상태입니다.
# 모든 레코드는 confidence ≥ 0.8 이므로 counterexamples 불필요(G), sensitivity=internal 이므로
# exception_rules 불필요. review_status=confirmed 만 런타임 활성화 가능(G3).

