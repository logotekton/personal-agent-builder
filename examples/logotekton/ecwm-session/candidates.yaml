# 재서술/판단 필요 (이 정규화에 미포함 — 원본 재확인 후 결정):
#   - CAND-ECWM-REDFLAG-001 "ECWM을 단순 그래프로 붕괴 금지" — 프로젝트 종속. 일반 원칙으로 재스코프하면
#     red_flags 후보가 될 수 있으나(예: "1차 모델을 평면 그래프로 환원하지 않는다"), 현 형태는 ECWM 한정.
#   - CAND-ECWM-EVAL-001 "좋은 답은 개념층 구분·평탄화 회피" — 전이 가능한 평가 케이스로 보이나 원본
#     evidence_refs 가 잘려 확인 불가 → 원본에서 evidence_refs 확정 후 user.evaluation_cases 후보로.
