# Logotekton — 평가 케이스 (evaluation cases · EvaluationCaseRecord ×6)
#
# > **EN:** Six real, evidence-bound EvaluationCaseRecords for the `logotekton` subject —
# > reproducible fidelity tests that ask "did the compiled Personal Agent decide, write,
# > and act the way Logotekton would approve?". Each case fixes an input_task and an
# > active_pack_set, then states in behavioral language what the agent MUST do
# > (expected_behavior) and MUST NOT do (unacceptable_behavior), with a scoring_rubric,
# > evidence_refs, the observed result, and correction_notes. Every record extends the
# > unified base record (../../schemas/record.base.schema.json) and the pack schema
# > (../../schemas/user.evaluation_cases.schema.json); record_type is the single value
# > EvaluationCaseRecord. Six cases satisfy the L1 maturity gate (≥3 eval cases,
# > traceability=1.0) and feed the decision_fidelity convergence index.
#
# 이 파일은 logotekton 주체의 인스턴스 팩 `personal.logotekton.evaluation_cases`(14팩 중 #13)의
# 확인된 평가 케이스 6개입니다. 각 케이스는 입력 작업과 활성 팩 집합을 고정한 뒤, 행동 언어로
# 반드시 해야 할 것/절대 하면 안 되는 것을 루브릭과 함께 명시하고, 실제 채점 결과를 증거에 묶어
# 기록합니다(계약 §10).
#   - 베이스 스키마   : ../../schemas/record.base.schema.json        (필수 11필드)
#   - 팩 스키마       : ../../schemas/user.evaluation_cases.schema.json
#   - 평가·드리프트   : ../../spec/05-evaluation-drift.md             (§1 8지표, §2 케이스 필드)
#   - 커널 스키마     : ../../spec/01-kernel-schema.md               (§7 베이스, §10 지표)
#   - 수렴 모델       : ../../spec/06-convergence-model.md           (decision_fidelity)
# id 형식: <subject>.evalcase.NNN. record_type=EvaluationCaseRecord(단일). 활성 팩은 정식
# 14팩 이름만 사용(구 코드명 폐기). evidence_refs ≥ 1(G1), scope 비어있지 않음(G2),
# confidence ≥ 0.7 이므로 counterexamples 불필요, sensitivity=internal 이므로 exception_rules 불필요.
# revolution-02 이후: 6개 모두 pass / 0 partial / 0 fail → decision_fidelity = 6/6 = 1.00.
# (revolution-01: 5 pass / 1 partial / 0 fail → 0.92. revolution-02 에서 eval.005 가 교정으로 partial→pass.)
# (T0: 4 pass / 1 partial / 1 fail → 0.75. eval.004 는 revolution-01 에서 fail→pass 전환됨.)

# ── eval.001 · 네이밍 준수 (naming compliance) ────────────────────────────────
# 공식 모델명/창립자 귀속을 묻는다. metric: decision_fidelity. 활성 팩: decision_policy + identity_roles.
