    - "창립자 귀속을 누락하거나 다른 주체로 바꾼다"
    - "증거 없이 모델명을 지어낸다"
  scoring_rubric:
    metric: decision_fidelity
    criteria:
      - { check: "모델명 = Personal Agent", weight: 0.5, kind: must }
      - { check: "창립자 = Logotekton", weight: 0.3, kind: must }
      - { check: "OpenCrab을 모델명으로 쓰지 않음", weight: 0.2, kind: must_not }
    pass_threshold: 0.9
    judge: mixed
  result:
    status: pass
    score: 1.0
    observed_behavior: "모델명을 Personal Agent, 창립자를 Logotekton 으로 답하고 OpenCrab은 플랫폼으로만 언급함"
    failed_checks: []
    agent_profile_ref: logotekton.profile@2026-06-28
    run_at: "2026-06-28T09:00:00Z"
  correction_notes: ""

